<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mark Attendance | FaceAI</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app-container">
        <!-- MAIN CAMERA VIEW -->
        <div class="camera-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas" class="hidden"></canvas>

            <div class="camera-overlay-ui">
                <!-- Premium Scanner Viewport Mask -->
                <div class="scanner-viewport" id="scanner-viewport"></div>

                <!-- Header -->
                <header class="app-header">
                    <div class="brand-logo">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" style="color: var(--primary);">
                            <path
                                d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <circle cx="12" cy="12" r="3" stroke-linecap="round" />
                        </svg>
                        FaceAI
                    </div>

                    <div class="header-date" id="header-date"></div>

                    <div class="header-clock" id="header-clock">00:00:00</div>
                </header>

                <!-- Scanning Orbital UI -->
                <div class="scanning-orbital" id="scanning-orbital">
                    <svg viewBox="0 0 320 360">
                        <ellipse class="orbital-ring" cx="160" cy="180" rx="130" ry="160" />
                        <ellipse class="pulsing-orbital" cx="160" cy="180" rx="130" ry="160" />
                        <!-- Decorative Particles -->
                        <circle class="particle" cx="160" cy="40" r="2" />
                        <circle class="particle" cx="160" cy="320" r="2" />
                        <circle class="particle" cx="40" cy="180" r="2" />
                        <circle class="particle" cx="280" cy="180" r="2" />
                    </svg>

                    <!-- Viewfinder Corners (mounted on orbital for alignment) -->
                    <div class="face-guide" id="face-guide">
                        <div class="corner-bracket tl"></div>
                        <div class="corner-bracket tr"></div>
                        <div class="corner-bracket bl"></div>
                        <div class="corner-bracket br"></div>
                        <div class="scan-line"></div>
                    </div>
                </div>

                <!-- Bottom section -->
                <div style="text-align: center; margin-bottom: 28px; pointer-events: none; z-index: 10;">
                    <!-- Status Pill -->
                    <div class="status-pill" id="status-pill">
                        <div class="status-dot scanning" id="status-dot"></div>
                        <span id="status-text">Scanning</span>
                    </div>

                    <a href="register.html" class="register-link">
                        New Employee? Register Here
                    </a>
                </div>
            </div>
        </div>

        <!-- LOADING OVERLAY -->
        <div id="overlay-loading" class="fullscreen-overlay hidden">
            <div class="loading-spinner"></div>
            <h2>Verifying Identity...</h2>
            <p style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text-muted);">Scanning face
                embeddings</p>
        </div>

        <!-- SUCCESS OVERLAY (slide-up card) -->
        <div id="overlay-success" class="hidden">
            <div class="success-flash" id="success-flash"></div>
            <div class="slide-up-overlay">
                <div class="slide-up-card" id="success-card">
                    <div class="check-icon">
                        <svg width="48" height="48" viewBox="0 0 80 80">
                            <circle cx="40" cy="40" r="36" fill="none" stroke="var(--success)" stroke-width="2"
                                stroke-dasharray="252" stroke-dashoffset="252"
                                style="animation: drawCircle 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;" />
                            <path d="M24 42 L34 52 L56 30" fill="none" stroke="var(--success)" stroke-width="3"
                                stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50"
                                stroke-dashoffset="50"
                                style="animation: drawCheck 0.3s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;" />
                        </svg>
                    </div>
                    <div class="employee-name" id="user-name">Welcome Back!</div>
                    <div class="checkin-time" id="checkin-time"></div>
                </div>
            </div>
        </div>

        <!-- ERROR OVERLAY -->
        <div id="overlay-error" class="fullscreen-overlay hidden">
            <div class="icon-circle error">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </div>
            <h2>Not Recognized</h2>
            <p id="error-msg" style="margin-bottom: 28px;">Please make sure your face is visible.</p>
            <button class="btn btn-secondary" onclick="resetApp()">
                Try Again
            </button>
        </div>

        <!-- Edge Glow (for error state) -->
        <div id="edge-glow" class="hidden"></div>
    </div>

    <script src="camera.js"></script>
    <script>
        // CONFIG
        const API_URL = 'https://nonrectangularly-bulbless-malcolm.ngrok-free.dev';

        let stream = null;

        // DOM Elements
        const views = {
            loading: document.getElementById('overlay-loading'),
            success: document.getElementById('overlay-success'),
            error: document.getElementById('overlay-error')
        };

        // --- CLOCK ---
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', {
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            });
            const date = now.toLocaleDateString('en-US', {
                weekday: 'short', month: 'short', day: 'numeric'
            });
            document.getElementById('header-clock').textContent = time;
            document.getElementById('header-date').textContent = date;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', async () => {
            await startCamera();

            // Check API health
            try {
                await fetch(`${API_URL}/`, {
                    headers: {
                        'ngrok-skip-browser-warning': 'true'
                    }
                });
            } catch (e) {
                const dot = document.getElementById('status-dot');
                dot.style.backgroundColor = 'var(--error)';
                dot.className = 'status-dot error-state';
                document.getElementById('status-text').textContent = 'Offline';
            }
        });

        // --- CAMERA ---
        async function startCamera() {
            // 1. SSL/Secure Context Check
            if (!window.isSecureContext) {
                showError("⚠️ HTTPS Required! Please use the 'https://' ngrok URL.");
                return;
            }

            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("Camera API not supported");
                }

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                const videoEl = document.getElementById('video');
                videoEl.srcObject = stream;

                // Ensure video plays
                videoEl.onloadedmetadata = () => {
                    videoEl.play().catch(e => console.error("Play error:", e));
                };

            } catch (e) {
                console.error("Camera Error:", e);
                let msg = "Camera access denied.";
                if (e.name === 'NotAllowedError') msg = "Permission denied. Allow camera access.";
                else if (e.name === 'NotFoundError') msg = "No camera found.";
                else if (e.name === 'NotReadableError') msg = "Camera in use by another app.";
                else if (e.name === 'SecurityError') msg = "Insecure context. Use HTTPS.";

                showError(`${msg} (${e.name})`);
            }
        }

        // --- AUTO-SCAN & VOICE ---
        let isScanning = false;
        let lastSpeakTime = 0;

        async function startAutoScan() {
            if (isScanning) return;
            isScanning = true;

            // Update status
            updateStatus('scanning', 'Scanning');

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            while (isScanning) {
                // Wait if video not ready
                if (video.paused || video.ended || video.readyState < 2) {
                    await new Promise(r => setTimeout(r, 500));
                    continue;
                }

                // Update to "Face Detected" when scanning
                updateStatus('detected', 'Face Detected');

                // Capture
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                const imageBase64 = canvas.toDataURL('image/jpeg', 0.6);

                // Update to "Verifying"
                updateStatus('verifying', 'Verifying');

                try {
                    const res = await fetch(`${API_URL}/attendance/check-in`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'ngrok-skip-browser-warning': 'true'
                        },
                        body: JSON.stringify({ face_image: imageBase64 })
                    });

                    const data = await res.json();

                    if (res.ok && data.recognized) {
                        isScanning = false;
                        showSuccess(data);
                        speakWelcome("Thank you");

                        // Auto-reset after 3.5 seconds
                        setTimeout(() => {
                            if (!isScanning) resetApp();
                        }, 3500);

                        break;
                    } else {
                        // Back to scanning
                        updateStatus('scanning', 'Scanning');
                    }
                } catch (e) {
                    updateStatus('scanning', 'Scanning');
                }

                // Wait before next scan
                await new Promise(r => setTimeout(r, 1000));
            }
        }

        function updateStatus(state, text) {
            const dot = document.getElementById('status-dot');
            const textEl = document.getElementById('status-text');
            const viewport = document.getElementById('scanner-viewport');
            const faceGuide = document.getElementById('face-guide');

            dot.className = `status-dot ${state}`;
            textEl.textContent = text;

            // Update scanning ring & viewport states
            if (state === 'detected' || state === 'verifying') {
                viewport?.classList.add('detected');
                faceGuide?.classList.add('detected');
            } else {
                viewport?.classList.remove('detected');
                faceGuide?.classList.remove('detected');
            }
        }

        function speakWelcome(text) {
            const now = Date.now();
            if (now - lastSpeakTime < 5000) return;
            lastSpeakTime = now;

            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                const voices = window.speechSynthesis.getVoices();
                const voice = voices.find(v => v.name.includes('Female') || v.name.includes('Google US English'));
                if (voice) utterance.voice = voice;
                utterance.pitch = 1.1;
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Hook into existing startCamera
        const originalStartCamera = startCamera;
        startCamera = async function () {
            await originalStartCamera();
            startAutoScan();
        };

        // --- UI UPDATES ---
        function showSuccess(data) {
            document.getElementById('user-name').textContent = `Hi, ${data.employee_name}!`;
            document.getElementById('checkin-time').textContent =
                new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            // Green flash
            const flash = document.getElementById('success-flash');
            flash.className = 'success-flash';
            setTimeout(() => { flash.className = 'hidden'; }, 600);

            // Show slide-up overlay
            views.success.classList.remove('hidden');
            updateStatus('granted', 'Access Granted');
        }

        function showError(msg) {
            // Only show major errors, not recognition fail in auto-mode
            if (isScanning) return;

            document.getElementById('error-msg').textContent = msg;
            views.error.classList.remove('hidden');

            // Edge glow
            const glow = document.getElementById('edge-glow');
            glow.className = 'edge-glow-error';
            setTimeout(() => { glow.className = 'hidden'; }, 1500);

            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        window.resetApp = () => {
            views.success.classList.add('hidden');
            views.error.classList.add('hidden');
            views.loading.classList.add('hidden');

            // Restart scanning
            if (!isScanning) {
                updateStatus('scanning', 'Scanning');
                startAutoScan();
            }
        };
    </script>
</body>

</html>
